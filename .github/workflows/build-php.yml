# Builds the static PHP (micro.sfx) that osaris-uk/utils packs its binaries with, for macOS and
# Linux on arm64 and x64, then commits the builds and publishes a release, which PHPacker downloads.
#
# Changes from phpacker/php-bin:
# - adds the pcntl and posix extensions (php-extensions.txt)
# - builds PHP 8.4 only, for macOS and Linux only
# - always downloads fresh PHP source and fails unless it built the latest 8.4 patch release
# - checks each build runs and has every extension
# - commits and releases all platforms together instead of opening a pull request per build
name: Build PHP

permissions:
  contents: write

on:
  schedule:
    # Monthly, to pick up PHP patch (security) releases.
    - cron: "0 3 1 * *"
  workflow_dispatch:

env:
  SPC_VERSION: 2.7.7
  PHP_MINOR: "8.4"

jobs:
  build:
    name: PHP ${{ matrix.target.build_os }} ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.os }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: macos-latest, spc: macos-aarch64, build_os: mac, arch: arm64 }
          - { os: macos-15-intel, spc: macos-x86_64, build_os: mac, arch: x64 }
          - { os: ubuntu-latest, spc: linux-x86_64, build_os: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, spc: linux-aarch64, build_os: linux, arch: arm64 }

    steps:
      - uses: actions/checkout@v5

      - name: Find the latest PHP ${{ env.PHP_MINOR }} release
        run: |
          latest=$(curl -fsS "https://www.php.net/releases/?json&version=${PHP_MINOR}" | php -r 'echo json_decode(stream_get_contents(STDIN), true)["version"];')
          echo "Latest PHP ${PHP_MINOR} release: ${latest}"
          echo "PHP_LATEST=${latest}" >> "$GITHUB_ENV"

      - name: Download static-php-cli
        run: |
          mkdir -p ../static-php-cli/bin
          curl -fsSL "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/spc-${{ matrix.target.spc }}.tar.gz" \
            | tar -xz -C ../static-php-cli/bin
          chmod +x ../static-php-cli/bin/spc

      - if: runner.os == 'macOS'
        run: brew install automake gzip

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: pecl, composer
          extensions: curl, openssl, mbstring, sodium, tokenizer
          ini-values: memory_limit=-1

      - name: Read PHP extensions
        run: echo "PHP_EXTENSIONS=$(tr -d '[:space:]' < php-extensions.txt)" >> "$GITHUB_ENV"

      # No download cache on purpose: a cached PHP source would pin an old patch release.
      - name: Download PHP and extension sources
        run: |
          cd ../static-php-cli
          ./bin/spc doctor
          ./bin/spc download --with-php="${PHP_MINOR}" --for-extensions "${PHP_EXTENSIONS}" --prefer-pre-built --retry=3

      - name: Build PHP
        run: |
          cd ../static-php-cli
          ./bin/spc build --build-micro "${PHP_EXTENSIONS}" --debug
          echo "PHP_VERSION_FULL=$(./bin/spc dev:php-version)" >> "$GITHUB_ENV"

      - name: Check it built the latest PHP ${{ env.PHP_MINOR }} release
        run: |
          if [ "${PHP_VERSION_FULL}" != "${PHP_LATEST}" ]; then
            echo "::error::Built PHP ${PHP_VERSION_FULL}, but the latest ${PHP_MINOR} release is ${PHP_LATEST}"
            exit 1
          fi

      - name: Check the build runs and has every extension
        run: |
          cat > check.php <<'PHP'
          <?php
          // Some names in php-extensions.txt aren't what extension_loaded() knows them by.
          $loaded = fn (string $e) => match ($e) {
              'opcache' => extension_loaded('Zend OPcache'),
              'mbregex' => function_exists('mb_ereg'),
              default => extension_loaded($e),
          };
          $missing = array_filter(explode(',', getenv('PHP_EXTENSIONS')), fn ($e) => ! $loaded($e));
          if ($missing) {
              fwrite(STDERR, 'Missing extensions: ' . implode(', ', $missing) . PHP_EOL);
              exit(1);
          }
          echo 'PHP ', PHP_VERSION, ' has ', getenv('PHP_EXTENSIONS'), PHP_EOL;
          PHP
          cat ../static-php-cli/buildroot/bin/micro.sfx check.php > check
          chmod +x check
          ./check
          rm check check.php

      - name: Package
        run: |
          dir="bin/${{ matrix.target.build_os }}/${{ matrix.target.arch }}"
          meta="${{ matrix.target.build_os }}-${{ matrix.target.arch }}"
          mkdir -p "$dir" license-files build-meta
          rm -f "$dir/php-${PHP_MINOR}.zip"
          (cd ../static-php-cli/buildroot/bin && zip "$GITHUB_WORKSPACE/$dir/php-${PHP_MINOR}.zip" micro.sfx)
          cp ../static-php-cli/buildroot/license/* license-files/
          cp ../static-php-cli/buildroot/build-extensions.json "build-meta/build-extensions-${meta}.json"
          cp ../static-php-cli/buildroot/build-libraries.json "build-meta/build-libraries-${meta}.json"
          echo "${PHP_VERSION_FULL}" > "build-meta/php-version-${meta}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.target.build_os }}-${{ matrix.target.arch }}
          path: |
            bin/${{ matrix.target.build_os }}/${{ matrix.target.arch }}/php-${{ env.PHP_MINOR }}.zip
            license-files
            build-meta

  release:
    # Only runs when every platform built, so a release always has all four.
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: php-*
          merge-multiple: true

      - name: Commit the builds
        run: |
          version=$(cat build-meta/php-version-linux-x64.txt)
          echo "PHP_VERSION_FULL=${version}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin license-files build-meta
          git commit -m "Build PHP ${version}" || echo "No changes to commit"
          git push

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="php-${PHP_VERSION_FULL}-${{ github.run_number }}"
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "PHP ${PHP_VERSION_FULL}" \
            --notes "PHP ${PHP_VERSION_FULL} (micro.sfx) for macOS and Linux, arm64 and x64, with: $(tr -d '[:space:]' < php-extensions.txt)"
